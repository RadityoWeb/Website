<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Radityo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .type-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 28px; }
    .type-btn {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px 14px;
      border-radius: 99px;
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .type-btn:hover { border-color: var(--blue); color: var(--blue); }
    .type-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }
    .project-card {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .project-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .project-icon-big { font-size: 32px; }
    .status-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 3px 10px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .status-live { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.25); }
    .status-done { background: rgba(59,130,246,0.15); color: var(--blue-bright); border: 1px solid rgba(59,130,246,0.25); }
    .status-wip  { background: rgba(245,158,11,0.15); color: var(--yellow); border: 1px solid rgba(245,158,11,0.25); }

    .project-card h3 {
      font-family: var(--font-head);
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .project-card p { font-size: 13.5px; color: var(--text-dim); line-height: 1.65; flex: 1; }
    .project-tech { display: flex; gap: 6px; flex-wrap: wrap; }
    .project-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    /* ADD PROJECT */
    .add-project-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 32px;
      display: none;
    }
    .add-project-panel.show { display: block; }
    .add-project-panel h3 {
      font-family: var(--font-head);
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    @media (max-width: 640px) {
      .project-grid { grid-template-columns: 1fr; }
      .form-row-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="nav-logo">radityo<span class="accent">.dev</span><span class="cursor"></span></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="posts.html">Posts</a>
    <a href="projects.html">Projects</a>
    <a href="progress.html">Progress</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>
<div class="page">
  <div class="container">
    <div class="page-header reveal">
      <div class="eyebrow">// portfolio</div>
      <h1>Projects</h1>
      <p>Tools, website, eksperimen jaringan, dan hal-hal random yang saya buat.</p>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px" class="reveal">
      <div class="type-filters" id="typeFilters" style="margin:0"></div>
      <button class="btn btn-primary" onclick="toggleAdd()">+ Tambah Project</button>
    </div>

    <div class="add-project-panel reveal" id="addPanel">
      <h3>🛠 Tambah Project Baru</h3>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="form-row-2">
          <div class="form-group">
            <label>Nama Project</label>
            <input type="text" id="pName" placeholder="Portfolio Website">
          </div>
          <div class="form-group">
            <label>Tipe</label>
            <select id="pType">
              <option>Website</option><option>Networking</option>
              <option>Coding</option><option>Tool</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Deskripsi</label>
          <textarea id="pDesc" rows="2" placeholder="Jelaskan projectnya..."></textarea>
        </div>
        <div class="form-row-2">
          <div class="form-group">
            <label>Tech (pisah koma)</label>
            <input type="text" id="pTech" placeholder="HTML, CSS, JS">
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="pStatus">
              <option value="live">🟢 Live</option>
              <option value="done">🔵 Done</option>
              <option value="wip">🟡 WIP</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Link (opsional)</label>
          <input type="text" id="pLink" placeholder="https://...">
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" onclick="addProject()">Simpan</button>
          <button class="btn btn-ghost" onclick="toggleAdd()">Batal</button>
        </div>
      </div>
    </div>

    <div class="project-grid reveal" id="projectGrid"></div>
  </div>
  <footer class="footer"><p>radityo<span>.dev</span> · <span id="projCount">0</span> projects</p></footer>
</div>
<script src="app.js"></script>
<script>
  const TYPES = ['Semua','Website','Networking','Coding','Tool'];
  const ICONS = { Website:'🖥️', Networking:'📡', Coding:'🐍', Tool:'🛠️' };
  let activeType = 'Semua';

  document.getElementById('typeFilters').innerHTML = TYPES.map(t => `
    <button class="type-btn ${t==='Semua'?'active':''}" onclick="setType('${t}')">${t}</button>`).join('');

  function setType(t) {
    activeType = t;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.textContent === t));
    renderProjects();
  }

  function renderProjects() {
    let projects = DB.get(KEYS.projects) || [];
    if (activeType !== 'Semua') projects = projects.filter(p => p.type === activeType);
    document.getElementById('projCount').textContent = projects.length;

    if (!projects.length) {
      document.getElementById('projectGrid').innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:var(--text-muted)"><div style="font-size:40px;margin-bottom:12px">🗂️</div><p>Belum ada project.</p></div>`;
      return;
    }

    document.getElementById('projectGrid').innerHTML = projects.map(p => `
      <div class="card project-card">
        <div class="project-top">
          <span class="project-icon-big">${ICONS[p.type]||'🛠️'}</span>
          <span class="status-badge status-${p.status}">${p.status === 'live' ? '● Live' : p.status === 'wip' ? '◐ WIP' : '✓ Done'}</span>
        </div>
        <h3>${p.title}</h3>
        <p>${p.desc}</p>
        <div class="project-tech">
          ${(p.tech||[]).map(t=>`<span class="tag tag-blue">${t}</span>`).join('')}
        </div>
        <div class="project-footer">
          <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">${fmt.dateShort(p.date)}</span>
          <div style="display:flex;gap:6px">
            ${p.link ? `<a href="${p.link}" target="_blank" class="btn btn-ghost" style="font-size:11px;padding:5px 12px">Lihat →</a>` : ''}
            <button onclick="deleteProject('${p.id}')" class="btn btn-ghost" style="font-size:11px;padding:5px 12px;color:var(--red)">🗑</button>
          </div>
        </div>
      </div>`).join('');
  }

  function toggleAdd() {
    document.getElementById('addPanel').classList.toggle('show');
  }

  function addProject() {
    const name = document.getElementById('pName').value.trim();
    const desc = document.getElementById('pDesc').value.trim();
    if (!name || !desc) { toast('❌ Nama & deskripsi wajib!', 'error'); return; }
    const tech = document.getElementById('pTech').value.split(',').map(t=>t.trim()).filter(Boolean);
    DB.push(KEYS.projects, {
      id: uid(), title: name, type: document.getElementById('pType').value,
      desc, tech, status: document.getElementById('pStatus').value,
      link: document.getElementById('pLink').value.trim(),
      date: new Date().toISOString()
    });
    toast('✅ Project ditambahkan!', 'success');
    toggleAdd();
    renderProjects();
  }

  function deleteProject(id) {
    if (!confirm('Hapus project ini?')) return;
    DB.remove(KEYS.projects, id);
    renderProjects();
    toast('🗑️ Project dihapus');
  }

  renderProjects();
</script>
</body>
</html>
