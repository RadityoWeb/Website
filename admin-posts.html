<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Posts — Radityo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding-top: 60px; }
    .admin-wrap { max-width: 960px; margin: 0 auto; padding: 40px 24px 80px; }

    .admin-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 32px;
    }
    .admin-head h1 {
      font-family: var(--font-head); font-size: 22px; font-weight: 800;
    }

    /* EDITOR */
    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      align-items: start;
    }
    .editor-main {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .editor-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .tb-btn {
      font-family: var(--font-mono);
      font-size: 12px;
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--text-dim);
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tb-btn:hover { border-color: var(--blue); color: var(--blue); }
    .tb-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }

    .editor-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .editor-tab {
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 10px 18px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      border-bottom: 2px solid transparent;
    }
    .editor-tab.active { color: var(--blue); border-bottom-color: var(--blue); }

    #postContent {
      min-height: 400px;
      border: none;
      border-radius: 0;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.8;
      resize: vertical;
      background: var(--card);
    }
    .preview-pane {
      display: none;
      padding: 20px 24px;
      min-height: 400px;
    }
    .preview-pane.show { display: block; }
    .preview-pane h1,h2,h3 { color: var(--text); margin: 20px 0 10px; font-family: var(--font-head); }
    .preview-pane p { color: var(--text-dim); margin-bottom: 12px; line-height: 1.8; }
    .preview-pane code { font-family: var(--font-mono); background: var(--bg3); padding: 2px 6px; border-radius:4px; color: var(--cyan); font-size:13px; }
    .preview-pane blockquote { border-left:3px solid var(--blue); padding:10px 16px; background:var(--glow-blue); border-radius:0 8px 8px 0; color:var(--text-dim); font-style:italic; margin:12px 0; }
    .preview-pane ul { padding-left:20px; color:var(--text-dim); margin-bottom:12px; }

    /* SIDEBAR */
    .editor-sidebar {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sidebar-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sidebar-card h3 {
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }
    select {
      background: var(--bg2);
    }

    /* POST LIST */
    .saved-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .saved-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      transition: all 0.2s;
    }
    .saved-item:hover { border-color: var(--border2); }
    .saved-item-info { flex: 1; min-width: 0; }
    .saved-item-title {
      font-size: 13px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .saved-item-meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
    .saved-item-actions { display: flex; gap: 6px; }
    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 14px;
      width: 28px; height: 28px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-icon:hover { border-color: var(--blue); color: var(--blue); }
    .btn-icon.del:hover { border-color: var(--red); color: var(--red); }

    @media (max-width: 768px) {
      .editor-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo">radityo<span class="accent">.dev</span><span class="cursor"></span></a>
  <div class="nav-links">
    <a href="posts.html">← Posts</a>
  </div>
</nav>

<div class="admin-wrap">
  <div class="admin-head">
    <h1>✍️ Tulis Post</h1>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" onclick="clearForm()">Reset</button>
      <button class="btn btn-primary" onclick="publishPost()">Publish →</button>
    </div>
  </div>

  <div class="editor-grid">
    <div>
      <!-- TITLE -->
      <div class="form-group" style="margin-bottom:12px">
        <input type="text" id="postTitle" placeholder="Judul postingan..." style="font-size:18px;font-weight:700;font-family:var(--font-head)">
      </div>

      <!-- EDITOR -->
      <div class="editor-main">
        <div class="editor-toolbar">
          <button class="tb-btn" onclick="ins('**','**')"><b>B</b></button>
          <button class="tb-btn" onclick="ins('*','*')"><i>I</i></button>
          <button class="tb-btn" onclick="ins('`','`')">code</button>
          <div class="tb-sep"></div>
          <button class="tb-btn" onclick="insLine('# ')">H1</button>
          <button class="tb-btn" onclick="insLine('## ')">H2</button>
          <button class="tb-btn" onclick="insLine('### ')">H3</button>
          <div class="tb-sep"></div>
          <button class="tb-btn" onclick="insLine('- ')">list</button>
          <button class="tb-btn" onclick="insLine('> ')">quote</button>
        </div>
        <div class="editor-tabs">
          <button class="editor-tab active" id="tabWrite" onclick="switchTab('write')">✍️ Tulis</button>
          <button class="editor-tab" id="tabPreview" onclick="switchTab('preview')">👁 Preview</button>
        </div>
        <textarea id="postContent" placeholder="Tulis dengan Markdown...&#10;&#10;# Judul&#10;## Sub Judul&#10;**bold** *italic* `code`&#10;- list item&#10;> quote"></textarea>
        <div class="preview-pane" id="previewPane"></div>
      </div>
    </div>

    <div class="editor-sidebar">
      <!-- SETTINGS -->
      <div class="sidebar-card">
        <h3>⚙️ Pengaturan</h3>
        <div class="form-group">
          <label>Kategori</label>
          <select id="postCat">
            <option>TKJ</option>
            <option>Python</option>
            <option>Gym</option>
            <option>Anime</option>
            <option>Bahasa</option>
            <option>Sekolah</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tags (pisah koma)</label>
          <input type="text" id="postTags" placeholder="networking, tkj, linux">
        </div>
        <div class="form-group">
          <label>Excerpt (ringkasan)</label>
          <textarea id="postExcerpt" rows="3" placeholder="Ringkasan singkat yang tampil di daftar post..."></textarea>
        </div>
      </div>

      <!-- SAVED POSTS -->
      <div class="sidebar-card">
        <h3>📚 Postingan Tersimpan</h3>
        <div class="saved-list" id="savedList"></div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const { createClient } = supabase;

const supabaseClient = createClient(
  'https://fjzodidenrrespgbnmby.supabase.co',
  'sb_publishable_W5fpLaxVIvGZvVTaXy0taQ_DeLZc1PH'
);
</script>
<script src="app.js"></script>
<script>
  function ins(before, after) {
    const ta = document.getElementById('postContent');
    const s = ta.selectionStart, e = ta.selectionEnd;
    const sel = ta.value.slice(s, e) || 'teks';
    ta.value = ta.value.slice(0, s) + before + sel + after + ta.value.slice(e);
    ta.focus();
    ta.setSelectionRange(s + before.length, s + before.length + sel.length);
  }

  function insLine(prefix) {
    const ta = document.getElementById('postContent');
    const s = ta.selectionStart;
    const lineStart = ta.value.lastIndexOf('\n', s-1) + 1;
    ta.value = ta.value.slice(0, lineStart) + prefix + ta.value.slice(lineStart);
    ta.focus();
    ta.setSelectionRange(s + prefix.length, s + prefix.length);
  }

  function switchTab(tab) {
    const ta = document.getElementById('postContent');
    const pane = document.getElementById('previewPane');
    if (tab === 'preview') {
      pane.innerHTML = parseMarkdown(ta.value);
      pane.classList.add('show');
      ta.style.display = 'none';
      document.getElementById('tabWrite').classList.remove('active');
      document.getElementById('tabPreview').classList.add('active');
    } else {
      pane.classList.remove('show');
      ta.style.display = '';
      document.getElementById('tabWrite').classList.add('active');
      document.getElementById('tabPreview').classList.remove('active');
    }
  }

async function publishPost() {
  try {
    const title   = document.getElementById('postTitle').value.trim();
    const content = document.getElementById('postContent').value.trim();
    const cat     = document.getElementById('postCat').value;
    const tags    = document.getElementById('postTags').value;
    const excerpt = document.getElementById('postExcerpt').value.trim();

    if (!title || !content) {
      alert('Isi judul dan konten');
      return;
    }

    const { data, error } = await supabaseClient
      .from('posts')
      .insert([{
        title: title,
        content: content,
        excerpt: excerpt,
        category: cat,
        tags: tags,
        date: new Date().toISOString(),
        views: 0,
        readtime: '3 mnt'
      }]);

    if (error) {
      console.error(error);
      alert('ERROR: ' + error.message);
      return;
    }

    alert('Post berhasil dipublish!');

    clearForm();

  } catch(err) {
    console.error(err);
    alert('ERROR BESAR: ' + err.message);
  }
}
  function clearForm() {
    document.getElementById('postTitle').value = '';
    document.getElementById('postContent').value = '';
    document.getElementById('postTags').value = '';
    document.getElementById('postExcerpt').value = '';
  }

  function loadPost(id) {
    const posts = DB.get(KEYS.posts) || [];
    const p = posts.find(x => x.id === id);
    if (!p) return;
    document.getElementById('postTitle').value = p.title;
    document.getElementById('postContent').value = p.content;
    document.getElementById('postCat').value = p.category;
    document.getElementById('postTags').value = (p.tags||[]).join(', ');
    document.getElementById('postExcerpt').value = p.excerpt;
    toast('📝 Post dimuat untuk diedit', 'info');
    // delete old, will re-publish
    DB.remove(KEYS.posts, id);
    renderSaved();
  }

  function deletePost(id) {
    if (!confirm('Hapus post ini?')) return;
    DB.remove(KEYS.posts, id);
    renderSaved();
    toast('🗑️ Post dihapus', 'error');
  }

  function renderSaved() {
    const posts = DB.get(KEYS.posts) || [];
    const el = document.getElementById('savedList');
    if (!posts.length) {
      el.innerHTML = '<p style="font-size:12px;color:var(--text-muted)">Belum ada post.</p>';
      return;
    }
    el.innerHTML = posts.slice(0, 8).map(p => `
      <div class="saved-item">
        <div class="saved-item-info">
          <div class="saved-item-title">${p.title}</div>
          <div class="saved-item-meta">${p.category} · ${fmt.dateShort(p.date)}</div>
        </div>
        <div class="saved-item-actions">
          <button class="btn-icon" onclick="loadPost('${p.id}')" title="Edit">✏️</button>
          <button class="btn-icon del" onclick="deletePost('${p.id}')" title="Hapus">🗑</button>
        </div>
      </div>`).join('');
  }

  renderSaved();
</script>
</body>
</html>
